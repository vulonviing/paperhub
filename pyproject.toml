[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "paperhub"
version = "0.1.1"
description = "Fetch HuggingFace Daily Papers and produce Jupyter-friendly AI summaries — one paper, one agent."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Emrecan Ulu", email = "emrecanulu19@gmail.com" },
]
maintainers = [
    { name = "Emrecan Ulu", email = "emrecanulu@outlook.com" },
]
keywords = ["huggingface", "papers", "arxiv", "llm", "summarization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "httpx>=0.27",
    "tenacity>=8",
    "beautifulsoup4>=4.12",
    "pypdf>=4",
    "pdfplumber>=0.11",
    "pydantic>=2",
    "pydantic-settings>=2",
    "openai>=2.32",
    "rich>=13",
    "ipython>=8",
    "python-dateutil>=2.9",
    "platformdirs>=4",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.95"]
google = ["google-genai>=1.56"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.8",
    "build>=1.2",
    "types-python-dateutil",
]

[project.scripts]
paperhub = "paperhub.interactive_cli:main"

[project.urls]
Homepage = "https://github.com/vulonviing/paperhub"
Issues = "https://github.com/vulonviing/paperhub/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/paperhub"]

[tool.hatch.build.targets.sdist]
include = [
    "src/paperhub",
    "docs/API_KEYS.md",
    "docs/ARCHITECTURE.md",
    "docs/HOW_TO_START.md",
    "examples/README.md",
    "examples/03_jupyter_quickstart.ipynb",
    ".env.example",
    "LICENSE",
    "README.md",
    "pyproject.toml",
]
exclude = [
    ".claude",
    "starter-template",
    "docs/PUBLISHING.md",
    "tests",
    "examples/03_jupyter_quickstart_tr.ipynb",
    "dist",
    "build",
    "*.egg-info",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    "**/.DS_Store",
    "**/__pycache__",
    "**/*.pyc",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "C4", "SIM"]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # function calls in argument defaults (Click decorators)
    "N818",  # exception name suffix
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "N802", "N803"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.mypy]
python_version = "3.10"
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
ignore_missing_imports = true
disallow_untyped_defs = false
follow_imports = "silent"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = false
